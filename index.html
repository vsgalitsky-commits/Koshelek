<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Кошелёк">
<meta name="theme-color" content="#EDF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Мультикошелёк</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one-screen phone app — sticky balance header, scrolling body, fixed tab bar. Circles = things you drag. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#E2E8E4; --fg:#13201B; --muted:#5B6C65; --line:#D2DBD6;
  --accent:#0E7560; --accent-fg:#FFFFFF; --exp:#C9503B; --inc:#1C8655; --warn:#B87C0C; --debt:#7B5CC4;
  --c-RUB:#3A68CF; --c-THB:#B98A12; --c-USDT:#12917E; --c-TRY:#CC4343; --c-USD:#4C7B37; --c-EUR:#6E55C2;
  --shadow:0 1px 2px rgba(19,32,27,.06),0 6px 18px rgba(19,32,27,.07);
  --font-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --font-body:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --tabh:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201D; --surface-2:#1F2B27; --fg:#E6EEEA; --muted:#8EA199; --line:#293632;
  --accent:#3DBE9A; --accent-fg:#06231B; --exp:#F07A62; --inc:#4CCB8C; --warn:#E3AE3D; --debt:#A88CF0;
  --c-RUB:#6F97F2; --c-THB:#E2B94A; --c-USDT:#3CC7B1; --c-TRY:#F07272; --c-USD:#86B566; --c-EUR:#A48DF0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201D; --surface-2:#1F2B27; --fg:#E6EEEA; --muted:#8EA199; --line:#293632;
  --accent:#3DBE9A; --accent-fg:#06231B; --exp:#F07A62; --inc:#4CCB8C; --warn:#E3AE3D; --debt:#A88CF0;
  --c-RUB:#6F97F2; --c-THB:#E2B94A; --c-USDT:#3CC7B1; --c-TRY:#F07272; --c-USD:#86B566; --c-EUR:#A48DF0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px))}

/* header */
.top.home{position:static}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.total{font-family:var(--font-display);font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1.1}
.sub{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.sub b{color:var(--fg);font-weight:600}
.chips{display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px}
.chip{border:0;background:transparent;border-radius:999px;padding:5px 10px;font-weight:600;font-size:14px;color:var(--muted)}
.chip.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

.sec{margin-top:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec-h h2{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-h .meta{font-size:13px;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}

/* circles */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 6px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.circ{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;position:relative;background:var(--surface);box-shadow:var(--shadow);border:0;padding:0;transition:transform .15s}
.circ .sym{font-weight:700;font-size:22px}
.cell .nm{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .val{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .val.neg{color:var(--exp)}
.ring{background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--surface-2) 0)}
.ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.ring>span{position:relative;z-index:1}
.circ.dash{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted);font-size:26px}
.dropok .circ{outline:2px dashed var(--accent);outline-offset:3px}
.dropover .circ{transform:scale(1.15);outline:3px solid var(--accent)}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);opacity:.92}
.dragging{opacity:.35}

.banner{background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:var(--shadow);flex-wrap:wrap}
.banner p{margin:0;font-size:13px;color:var(--muted);flex:1 1 200px}
.due{display:flex;flex-direction:column;gap:6px}
.due-row{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.due-row .t{flex:1;min-width:0}
.due-row .t div:first-child{font-weight:600}
.due-row .t div:last-child{font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;letter-spacing:.02em}
.pill.over{background:color-mix(in srgb,var(--exp) 16%,transparent);color:var(--exp)}
.pill.soon{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.later{background:var(--surface-2);color:var(--muted)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--surface-2);color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--exp)}
.btn:focus-visible,.chip:focus-visible,.circ:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:30px;box-shadow:0 8px 22px rgba(0,0,0,.25);z-index:25;line-height:1}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{flex:1;border:0;background:none;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}

/* lists */
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;background:var(--surface-2)}
.row .t{flex:1;min-width:0}
.row .t .a{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t .b{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;font-weight:600;white-space:nowrap}
.row .amt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.exp{color:var(--exp)} .inc{color:var(--inc)} .muted{color:var(--muted)} .dbt{color:var(--debt)}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:16px 4px 6px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;font-weight:500}
.fchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* stats */
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chart{padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .v{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--c,var(--accent))}

/* plans */
.plan{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.plan:first-child{border-top:0}
.plan-h{display:flex;align-items:center;gap:10px}
.plan-h .t{flex:1;font-weight:600;min-width:0}
.pl-line{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.pl-line .muted{white-space:nowrap}

/* sheet */
.back{position:fixed;inset:0;background:rgba(5,12,10,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 12px;font-family:var(--font-display);font-weight:500;font-size:18px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.back,.sheet{animation:none}.circ{transition:none}}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:600}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.inp.big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;padding:10px 12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ratebox{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.actions{display:flex;gap:8px;margin-top:6px}
.actions .btn{flex:1}
.cur-tag{font-size:13px;color:var(--muted);font-weight:600}
.amt-wrap{position:relative}
.amt-wrap .cur-tag{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:20px}
textarea.inp{font-size:13px;font-family:ui-monospace,Menlo,monospace;min-height:120px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:90%;text-align:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.emoji-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.emoji-pick button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.emoji-pick button.on{border:2px solid var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.swatches button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--fg)}
h1.page{font-family:var(--font-display);font-weight:500;font-size:22px;margin:0}
</style>

</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>

<script>
(()=>{
'use strict';
const KEY='multikoshelek_v1';
const CUR={RUB:{s:'₽',d:0},THB:{s:'฿',d:0},USDT:{s:'₮',d:2},TRY:{s:'₺',d:0},USD:{s:'$',d:2},EUR:{s:'€',d:2}};
const CURS=Object.keys(CUR);
const BASES=['THB','RUB','USDT','TRY'];
const FALLBACK={USD:1,USDT:1,RUB:81,THB:32.5,TRY:42,EUR:0.86};
const PALETTE=['#E0663F','#D8A21B','#3E9E5B','#1F8F95','#3A6FD0','#7558C9','#C2477F','#8C6B4F','#5F7D2E','#C24A4A','#2E8C70','#9A5BC2'];
const EMOJI=['🍜','🛒','☕','🏠','🚕','⛽','🛵','📱','💡','💊','🐶','🎁','✈️','🏖️','👕','🎮','📺','🏋️','💇','🍺','🎓','🔧','💼','💰','📈','🪙','💸','🧾','🚗','🌴'];
const MONTHS=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MON_S=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MON_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const TT={expense:'Расход',income:'Доход',transfer:'Перевод',lend:'Дал в долг',lendBack:'Вернули долг',borrow:'Взял в долг',borrowBack:'Отдал долг',adjust:'Корректировка'};
const FROM_TYPES=['expense','transfer','lend','borrowBack'];
const TO_TYPES=['income','transfer','lendBack','borrow'];

// ---------- utils
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=parseD(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const weekStart=s=>{const d=parseD(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const mKey=s=>s.slice(0,7);
const human=s=>{const d=parseD(s);const t=today();if(s===t)return 'Сегодня';if(s===addDays(t,-1))return 'Вчера';if(s===addDays(t,1))return 'Завтра';return `${d.getDate()} ${MON_G[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''}`};
function nf(n,dec){return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:dec}).format(n)}
function fmt(n,cur,dec){const c=CUR[cur]||{s:cur,d:2};return nf(n,dec??c.d)+' '+c.s}
function compact(n,cur){const a=Math.abs(n);const c=CUR[cur]||{s:cur};if(a>=1e6)return nf(n/1e6,1)+'M '+c.s;if(a>=1e4)return nf(n/1e3,1)+'K '+c.s;return fmt(n,cur,a<100&&c.d?2:0)}
function parseAmt(v){v=String(v||'').replace(/\s/g,'').replace(/,/g,'.');if(!v)return NaN;if(!/^[\d.+\-*/()]+$/.test(v))return NaN;try{const r=Function('"use strict";return ('+v+')')();return Number.isFinite(r)?Math.round(r*1e8)/1e8:NaN}catch(e){return NaN}}

// ---------- state
let S;
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function seed(){
  const t=today();
  const A=(id,name,cur,init,color)=>({id,name,cur,init,color,hidden:false});
  const C=(id,name,e,color,kind='exp')=>({id,name,e,color,kind});
  const s={v:1,demo:true,base:'THB',rateMode:'market',rates:{r:{...FALLBACK},at:null,src:'примерные'},
    accounts:[A('a1','Рубли · карта','RUB',180000,'#3A68CF'),A('a2','Рубли · запас','RUB',250000,'#2E4FA0'),A('a3','Лиры','TRY',12000,'#CC4343'),A('a4','Биржа USDT','USDT',1500,'#12917E'),A('a5','Биржа ฿','THB',8000,'#B98A12'),A('a6','Тайский банк','THB',70000,'#8C6B12')],
    cats:[C('c1','Еда','🛒','#3E9E5B'),C('c2','Кафе','🍜','#E0663F'),C('c3','Аренда','🏠','#3A6FD0'),C('c4','Транспорт','🛵','#D8A21B'),C('c5','Подписки','📱','#7558C9'),C('c6','Собака','🐶','#8C6B4F'),C('c7','Здоровье','💊','#C2477F'),C('c8','Поездки','🌴','#1F8F95'),
      C('i1','Работа','💼','#1C8655','inc'),C('i2','Маркетплейсы','📈','#2E8C70','inc'),C('i3','Прочее','🪙','#8C6B4F','inc')],
    tx:[],plans:{c1:[{a:12000,cur:'THB'}],c2:[{a:8000,cur:'THB'}],c3:[{a:25000,cur:'THB'}],c4:[{a:4000,cur:'THB'}],c5:[{a:30,cur:'USDT'},{a:1500,cur:'RUB'}]},
    sched:[]};
  const tx=(o)=>s.tx.push({id:uid(),note:'',...o});
  for(let m=1;m>=0;m--){
    const b=addMonths(t,-m).slice(0,8);
    const day=n=>{const x=b+pad(n);return x>t?null:x};
    const D=n=>day(n);
    if(D(2)){tx({t:'income',d:D(2),to:'a1',a:240000,cat:'i1'})}
    if(D(3)){tx({t:'transfer',d:D(3),from:'a1',to:'a4',a:92000,b:1000,note:'P2P'})}

S=load()||seed();

const acc=id=>S.accounts.find(a=>a.id===id);
const cat=id=>S.cats.find(c=>c.id===id);
const accCur=id=>(acc(id)||{}).cur||'THB';
const txCurA=t=>accCur(t.from||t.to);

// ---------- balances & rates
function balances(){const b={};S.accounts.forEach(a=>b[a.id]=+a.init||0);
  for(const t of S.tx){if(t.from&&b[t.from]!=null)b[t.from]-=t.a;if(t.to&&b[t.to]!=null)b[t.to]+=(t.t==='transfer'?t.b:t.a)}return b}
const R=c=>S.rates.r[c]||FALLBACK[c]||1;
const convM=(n,f,to)=>f===to?n:n/R(f)*R(to);
let OWN=null,OWNsig='';
function ownGraph(){const sig=S.tx.length+':'+(S.tx[S.tx.length-1]||{}).id+':'+S.rateMode;if(OWN&&OWNsig===sig)return OWN;
  const since=addDays(today(),-180);const E={};
  for(const t of S.tx){if(t.t!=='transfer'||t.d<since)continue;const a=txCurA(t),b=txCurB(t);if(a===b)continue;
    const k=[a,b].sort().join('|');E[k]=E[k]||{[a]:0,[b]:0};E[k][a]+=t.a;E[k][b]+=t.b}
  const adj={};for(const k in E){const [x,y]=k.split('|');const r=E[k][y]/E[k][x];(adj[x]=adj[x]||{})[y]=r;(adj[y]=adj[y]||{})[x]=1/r}
  OWN={adj,cache:{},pairs:E};OWNsig=sig;return OWN}
function ownRate(f,to){const g=ownGraph();const k=f+'>'+to;if(k in g.cache)return g.cache[k];
  const q=[[f,1]],seen=new Set([f]);let res=null;
  while(q.length){const [c,r]=q.shift();if(c===to){res=r;break}for(const n in g.adj[c]||{}){if(!seen.has(n)){seen.add(n);q.push([n,r*g.adj[c][n]])}}}
  g.cache[k]=res;return res}
function conv(n,f,to){if(f===to)return n;if(S.rateMode==='own'){const r=ownRate(f,to);if(r)return n*r}return convM(n,f,to)}

// ---------- analytics helpers
function expBase(t){return conv(t.a,txCurA(t),S.base)}
function inMonth(t,mk){return t.d.slice(0,7)===mk}
function debts(){const p={};for(const t of S.tx){if(!t.who)continue;const sign={lend:1,lendBack:-1,borrow:-1,borrowBack:1}[t.t];if(!sign)continue;
  const c=txCurA(t);p[t.who]=p[t.who]||{};p[t.who][c]=(p[t.who][c]||0)+sign*t.a}
  for(const w in p){for(const c in p[w])if(Math.abs(p[w][c])<1e-6)delete p[w][c];if(!Object.keys(p[w]).length)delete p[w]}return p}
function debtTotals(){let owed=0,owe=0;const d=debts();for(const w in d)for(const c in d[w]){const v=conv(d[w][c],c,S.base);if(v>0)owed+=v;else owe-=v}return {owed,owe}}

function buckets(unit){const t=today();const out=[];
  if(unit==='day'){for(let i=29;i>=0;i--){const d=addDays(t,-i);out.push({k:d,l:String(parseD(d).getDate()),full:human(d),test:x=>x===d})}}
  if(unit==='week'){const w0=weekStart(t);for(let i=11;i>=0;i--){const s=addDays(w0,-7*i),e=addDays(s,6);const sd=parseD(s);out.push({k:s,l:`${sd.getDate()}.${pad(sd.getMonth()+1)}`,full:`${human(s)} – ${human(e)}`,test:x=>x>=s&&x<=e})}}
  if(unit==='month'){const m0=t.slice(0,8)+'01';for(let i=11;i>=0;i--){const m=addMonths(m0,-i).slice(0,7);const md=parseD(m+'-01');out.push({k:m,l:MON_S[md.getMonth()],full:MONTHS[md.getMonth()]+' '+md.getFullYear(),test:x=>x.startsWith(m)})}}
  if(unit==='year'){const y=new Date().getFullYear();for(let i=4;i>=0;i--){const yy=String(y-i);out.push({k:yy,l:yy,full:yy+' год',test:x=>x.startsWith(yy)})}}

  const s=sums[sel];
  h+=`<div class="sec"><div class="sec-h"><h2>${esc(B.full)}</h2></div><div class="kpis"><div class="kpi"><div class="k">Доходы</div><div class="v num inc">${compact(s.i,S.base)}</div></div><div class="kpi"><div class="k">Расходы</div><div class="v num exp">${compact(s.e,S.base)}</div></div><div class="kpi"><div class="k">Итог</div><div class="v num ${s.i-s.e>=0?'inc':'exp'}">${s.i-s.e>=0?'+':'−'}${compact(Math.abs(s.i-s.e),S.base)}</div></div></div></div>`;
  const by={},byCur={};for(const t of S.tx){if(!B.test(t.d)||t.t!==kinds)continue;by[t.cat]=(by[t.cat]||0)+expBase(t);const c=txCurA(t);byCur[t.cat]=byCur[t.cat]||{};byCur[t.cat][c]=(byCur[t.cat][c]||0)+t.a}
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);const max=rows[0]?rows[0][1]:1;const tot=rows.reduce((a,r)=>a+r[1],0);

    return `<div class="row" style="flex-wrap:wrap"><span class="ic" style="background:color-mix(in srgb,${c.color} 15%,var(--surface))">${esc(c.e)}</span><span class="t"><div class="a">${esc(c.name)}</div><div class="b num">${esc(cc)}</div></span><span class="amt num">${fmt(v,S.base)}<small>${nf(v/tot*100,0)}%</small></span><div class="bar" style="flex-basis:100%;--c:${c.color}"><i style="width:${v/max*100}%"></i></div></div>`}).join('')}</div>`:`<div class="card empty">За этот период ничего нет</div>`}</div>`;
  const bal=balances();
  h+=`<div class="sec"><div class="sec-h"><h2>Где лежат деньги</h2></div><div class="card list">${S.accounts.filter(a=>!a.hidden).map(a=>`<div class="row"><span class="ic" style="color:${a.color||`var(--c-${a.cur})`};font-weight:700">${CUR[a.cur].s}</span><span class="t"><div class="a">${esc(a.name)}</div><div class="b num">${fmt(bal[a.id],a.cur)}</div></span><span class="amt num">${a.cur===S.base?'':'≈ '}${fmt(conv(bal[a.id],a.cur,S.base),S.base)}</span></div>`).join('')}</div></div>`;
  return h}
function barChart(bs,vals,sel,color){const W=360,H=170,pl=6,pr=6,pt=16,pb=22;const n=bs.length;const max=Math.max(1,...vals);
  const nice=niceMax(max);const iw=W-pl-pr,ih=H-pt-pb;const bw=iw/n;const gap=Math.max(1.5,bw*0.22);
  let g='';[0.5,1].forEach(f=>{const y=pt+ih-ih*f;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${W-pr}" y="${y-3}" text-anchor="end" font-size="9" fill="var(--muted)">${compact(nice*f,S.base)}</text>`});
  let bars='';bs.forEach((b,i)=>{const v=vals[i];const h=v/nice*ih;const x=pl+i*bw+gap/2;const w=bw-gap;const y=pt+ih-h;
    bars+=`<g data-act="stSel" data-v="${b.k}" style="cursor:pointer"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih+pb}" fill="transparent"/><rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,v>0?1.5:0)}" rx="${Math.min(3,w/2)}" fill="${color}" opacity="${i===sel?1:.38}"/>`;
    const every=n>20?5:1;if(i%every===0||i===sel||i===n-1&&n<=20)bars+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="${i===sel?'var(--fg)':'var(--muted)'}" font-weight="${i===sel?700:400}">${esc(b.l)}</text>`;
    bars+='</g>'});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График">${g}<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="var(--line)"/>${bars}</svg>`}
function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));const f=m/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

// ---------- PLAN
function rPlan(){const mk=mKey(today());const exps=S.cats.filter(c=>c.kind==='exp');
  const spentBy={};for(const t of S.tx){if(t.t!=='expense'||!inMonth(t,mk))continue;const c=txCurA(t);spentBy[t.cat]=spentBy[t.cat]||{};spentBy[t.cat][c]=(spentBy[t.cat][c]||0)+t.a}
  let planT=0,spT=0;
  const cards=exps.map(c=>{const pl=S.plans[c.id]||[];const sp=spentBy[c.id]||{};const pb=planBase(c.id);const sb=Object.entries(sp).reduce((s,[k,v])=>s+conv(v,k,S.base),0);planT+=pb;spT+=sb;
    if(!pl.length&&!sb)return '';
    const curs=[...new Set([...pl.map(p=>p.cur),...Object.keys(sp)])];
    const lines=curs.map(k=>{const p=pl.filter(x=>x.cur===k).reduce((s,x)=>s+x.a,0);const v=sp[k]||0;return `<div class="pl-line num"><span>${fmt(v,k)} <span class="muted">из ${p?fmt(p,k):'— без плана'}</span></span>${p?`<span class="${v>p?'exp':'muted'}">${v>p?'перерасход '+fmt(v-p,k):'осталось '+fmt(p-v,k)}</span>`:''}</div>`}).join('');
    const pct=pb?Math.min(100,sb/pb*100):100;const col=pb&&sb>pb?'var(--exp)':pct>85?'var(--warn)':'var(--inc)';
    return `<div class="plan"><div class="plan-h"><span class="ic" style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,${c.color} 15%,var(--surface))">${esc(c.e)}</span><span class="t">${esc(c.name)}</span><span class="num" style="font-size:13px">${compact(sb,S.base)} / ${pb?compact(pb,S.base):'—'}</span><button class="btn sm" data-act="editPlan" data-v="${c.id}">План</button></div>${lines}<div class="bar" style="--c:${col}"><i style="width:${pct}%"></i></div></div>`}).join('');
  const noPlan=exps.filter(c=>!(S.plans[c.id]||[]).length&&!spentBy[c.id]);
  let h=`<div class="top"><div class="top-row"><h1 class="page">Планы</h1><div class="chips">${BASES.map(c=>`<button class="chip ${S.base===c?'on':''}" data-act="base" data-v="${c}">${CUR[c].s}</button>`).join('')}</div></div></div>`;
  h+=`<div class="kpis"><div class="kpi"><div class="k">План на ${MONTHS[new Date().getMonth()]}</div><div class="v num">${compact(planT,S.base)}</div></div><div class="kpi"><div class="k">Потрачено</div><div class="v num exp">${compact(spT,S.base)}</div></div><div class="kpi"><div class="k">Осталось</div><div class="v num ${planT-spT>=0?'inc':'exp'}">${compact(planT-spT,S.base)}</div></div></div>`;
  h+=`<div class="sec"><div class="sec-h"><h2>Бюджет по категориям</h2></div><div class="card">${cards||'<div class="empty">Планов пока нет</div>'}</div>${noPlan.length?`<div class="filters" style="margin-top:8px">${noPlan.map(c=>`<button class="fchip" data-act="editPlan" data-v="${c.id}">+ ${esc(c.e)} ${esc(c.name)}</button>`).join('')}</div>`:''}</div>`;
  // schedule
  const t=today();const list=[...S.sched].sort((a,b)=>a.next.localeCompare(b.next));const to30=addDays(t,30);
  let p30=0,i30=0;for(const x of S.sched){let d=x.next;let g=0;while(d<=to30&&g++<60){const v=conv(x.a,accCur(x.acc),S.base);if(x.kind==='pay')p30+=v;else i30+=v;if(x.freq==='once')break;d=nextDate(d,x.freq)}}
  h+=`<div class="sec"><div class="sec-h"><h2>График платежей</h2><button class="link" data-act="newSched">+ Пункт</button></div>
   <div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:8px"><div class="kpi"><div class="k">Поступит за 30 дней</div><div class="v num inc">${compact(i30,S.base)}</div></div><div class="kpi"><div class="k">Спишется за 30 дней</div><div class="v num exp">${compact(p30,S.base)}</div></div></div>
   ${list.length?`<div class="card list">${list.map(x=>{const st=x.next<t?'over':(x.next<=addDays(t,7)?'soon':'later');const c=cat(x.cat);
     return `<div class="row"><span class="ic" style="background:color-mix(in srgb,${c?c.color:'var(--muted)'} 15%,var(--surface))">${esc(c?c.e:'•')}</span><button class="t" style="border:0;background:none;text-align:left;padding:0" data-act="editSched" data-v="${x.id}"><div class="a">${esc(x.name)}</div><div class="b">${human(x.next)} · ${{once:'один раз',week:'каждую неделю',month:'каждый месяц',year:'каждый год'}[x.freq]} · ${esc((acc(x.acc)||{}).name||'')}</div></button><span class="amt num"><span class="${x.kind==='pay'?'exp':'inc'}">${x.kind==='pay'?'−':'+'}${fmt(x.a,accCur(x.acc))}</span><small><span class="pill ${st}">${st==='over'?'просрочено':st==='soon'?'скоро':'позже'}</span></small></span><button class="btn sm pri" data-act="schedDo" data-v="${x.id}" aria-label="Провести">✓</button></div>`}).join('')}</div>`:`<div class="card empty">Добавь аренду, подписки, зарплату — они появятся здесь и на главной, когда подойдёт срок.</div>`}</div>`;
  return h}
function nextDate(d,f){return f==='week'?addDays(d,7):f==='month'?addMonths(d,1):f==='year'?addMonths(d,12):d}

function debtList(d){const ws=Object.keys(d);if(!ws.length)return `<div class="card empty">Никто никому не должен. Перетащи счёт на «Долги» на главной.</div>`;

     <button class="btn sm ${pos?'pri':''}" data-act="${pos?'debtBack':'debtPay'}" data-v="${esc(w)}">${pos?'Вернул':'Отдать'}</button></div>`}).join('')}</div>`}

function sheet(html){closeSheet();const b=document.createElement('div');b.className='back';b.id='sheet';b.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  b.addEventListener('click',e=>{if(e.target===b)closeSheet()});document.body.appendChild(b);document.body.style.overflow='hidden';return b.firstChild}
function closeSheet(){const s=$('#sheet');if(s)s.remove();document.body.style.overflow=''}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function ask(title,text,okLabel,danger,onOk){const s=sheet(`<h3>${esc(title)}</h3><p class="muted" style="margin:0 0 14px">${esc(text)}</p><div class="actions"><button class="btn" data-act="close">Отмена</button><button class="btn ${danger?'danger':'pri'}" id="askOk">${esc(okLabel)}</button></div>`);

// ---------- transaction form
let F=null;
function openTx(o){const t=today();F={type:'expense',from:'',to:'',cat:'',who:'',a:'',b:'',d:t,note:'',edit:null,sched:null,...o};
  if(!F.from&&FROM_TYPES.includes(F.type))F.from=(S.accounts.find(a=>!a.hidden)||{}).id||'';
  if(!F.to&&TO_TYPES.includes(F.type))F.to=(S.accounts.find(a=>!a.hidden&&a.id!==F.from)||{}).id||'';
  if(F.type==='expense'&&!F.cat)F.cat=(S.cats.find(c=>c.kind==='exp')||{}).id;
  if(F.type==='income'&&!F.cat)F.cat=(S.cats.find(c=>c.kind==='inc')||{}).id;
  drawTx()}
function accOpts(sel,excl){return S.accounts.filter(a=>!a.hidden||a.id===sel).filter(a=>a.id!==excl).map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)} · ${CUR[a.cur].s}</option>`).join('')}
function drawTx(){const T=F.type;const usesFrom=FROM_TYPES.includes(T)||T==='adjust'&&F.from;const usesTo=TO_TYPES.includes(T);
  const ca=usesFrom?accCur(F.from):accCur(F.to);const cb=accCur(F.to);const multi=T==='transfer'&&ca!==cb;
  const people=[...new Set(S.tx.filter(t=>t.who).map(t=>t.who))];
  const typeSeg=F.edit?'':`<div class="seg" style="margin-bottom:12px">${[['expense','Расход'],['income','Доход'],['transfer','Перевод'],['lend','Долг']].map(([k,n])=>`<button class="${T===k||(k==='lend'&&['lend','lendBack','borrow','borrowBack'].includes(T))?'on':''}" data-act="fType" data-v="${k}">${n}</button>`).join('')}</div>`;
  const debtSeg=['lend','lendBack','borrow','borrowBack'].includes(T)?`<div class="seg" style="margin-bottom:12px">${[['lend','Дал'],['lendBack','Мне вернули'],['borrow','Взял'],['borrowBack','Я вернул']].map(([k,n])=>`<button class="${T===k?'on':''}" data-act="fType" data-v="${k}">${n}</button>`).join('')}</div>`:'';
  const cats=S.cats.filter(c=>c.kind===(T==='income'?'inc':'exp'));
  let h=`<h3>${F.edit?'Изменить: ':''}${TT[T]}</h3>${typeSeg}${debtSeg}`;
  if(T==='adjust'){h+=`<div class="ratebox">Корректировка меняет остаток счёта и не попадает в расходы и доходы.</div>`}
  if(usesFrom)h+=`<label class="fld"><span>${T==='transfer'?'Откуда':'Со счёта'}</span><select class="inp" id="fFrom" data-f="from">${accOpts(F.from,T==='transfer'?null:null)}</select></label>`;
  if(usesTo)h+=`<label class="fld"><span>${T==='transfer'?'Куда':'На счёт'}</span><select class="inp" id="fTo" data-f="to">${accOpts(F.to,T==='transfer'?F.from:null)}</select></label>`;
  if(T==='expense'||T==='income')h+=`<label class="fld"><span>Категория</span><select class="inp" id="fCat" data-f="cat">${cats.map(c=>`<option value="${c.id}" ${c.id===F.cat?'selected':''}>${esc(c.e)} ${esc(c.name)}</option>`).join('')}</select></label>`;
  if(['lend','lendBack','borrow','borrowBack'].includes(T))h+=`<label class="fld"><span>Кто</span><input class="inp" id="fWho" data-f="who" list="peopleList" value="${esc(F.who)}" placeholder="Имя" autocomplete="off"><datalist id="peopleList">${people.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></label>`;
  h+=`<label class="fld"><span>${multi?'Ушло':'Сумма'}</span><div class="amt-wrap"><input class="inp big" id="fA" data-f="a" inputmode="decimal" placeholder="0" value="${esc(F.a)}" autocomplete="off"><span class="cur-tag">${CUR[ca].s}</span></div></label>`;
  if(multi){h+=`<label class="fld"><span>Пришло</span><div class="amt-wrap"><input class="inp big" id="fB" data-f="b" inputmode="decimal" placeholder="0" value="${esc(F.b)}" autocomplete="off"><span class="cur-tag">${CUR[cb].s}</span></div></label><div class="ratebox num" id="rateInfo"></div>`}
  h+=`<div class="two"><label class="fld"><span>Дата</span><input class="inp" type="date" id="fD" data-f="d" value="${F.d}"></label><label class="fld"><span>Заметка</span><input class="inp" id="fN" data-f="note" value="${esc(F.note)}" placeholder="необязательно"></label></div>
   <div class="actions">${F.edit?`<button class="btn danger" data-act="delTx">Удалить</button>`:`<button class="btn" data-act="close">Отмена</button>`}<button class="btn pri" data-act="saveTx">Сохранить</button></div>`;
  const s=sheet(h);
  s.querySelectorAll('[data-f]').forEach(el=>{const ev=el.tagName==='SELECT'?'change':'input';el.addEventListener(ev,()=>{F[el.dataset.f]=el.value;
    if(el.tagName==='SELECT'){if(F.type==='transfer'&&F.from===F.to)F.to=(S.accounts.find(a=>!a.hidden&&a.id!==F.from)||{}).id||'';drawTx()}else rateInfo()})});
  rateInfo();
  const a=s.querySelector('#fA');if(a&&!F.edit)setTimeout(()=>{try{a.focus()}catch(e){}},250)}
function rateInfo(){const el=$('#rateInfo');if(!el)return;const a=parseAmt(F.a),b=parseAmt(F.b);const ca=accCur(F.from),cb=accCur(F.to);
  if(a>0&&b>0){const [x,y,r]=R(ca)<R(cb)?[ca,cb,b/a]:[cb,ca,a/b];const mk=convM(1,x,y);const diff=(r/mk-1)*100;
    el.innerHTML=`Твой курс: 1 ${x} = <b>${nf(r,4)} ${y}</b><br>Рынок: ${nf(mk,4)} ${y} (${diff>=0?'+':''}${nf(diff,1)}%)`}
  else{const m=convM(1,ca,cb);el.innerHTML=`Введи обе суммы — курс посчитается сам.<br>Рынок сейчас: 1 ${ca} = ${nf(m,m<1?6:4)} ${cb}`}}
function saveTx(){const T=F.type;const a=parseAmt(F.a);if(!(a>0)){toast('Введи сумму больше нуля');return}
  const tx={id:F.edit||uid(),t:T,d:F.d||today(),note:(F.note||'').trim()};
  if(FROM_TYPES.includes(T)){if(!F.from){toast('Выбери счёт');return}tx.from=F.from}
  if(TO_TYPES.includes(T)){if(!F.to){toast('Выбери счёт');return}tx.to=F.to}
  if(T==='adjust'){if(F.from)tx.from=F.from;else tx.to=F.to}
  if(T==='transfer'&&tx.from===tx.to){toast('Выбери разные счета');return}
  tx.a=a;
  if(T==='transfer'){const same=accCur(tx.from)===accCur(tx.to);const b=same?a:parseAmt(F.b);if(!(b>0)){toast('Введи, сколько пришло');return}tx.b=b}
  if(T==='expense'||T==='income')tx.cat=F.cat;
  if(['lend','lendBack','borrow','borrowBack'].includes(T)){const w=(F.who||'').trim();if(!w){toast('Напиши имя');return}tx.who=w}
  if(F.edit){const i=S.tx.findIndex(x=>x.id===F.edit);if(i>=0)S.tx[i]=tx}else S.tx.push(tx);
  if(F.sched){const x=S.sched.find(z=>z.id===F.sched);if(x){if(x.freq==='once')S.sched=S.sched.filter(z=>z!==x);else x.next=nextDate(x.next,x.freq)}}
  save();closeSheet();render();toast(F.edit?'Изменено':'Записано')}

// ---------- export / import
function inFrame(){try{return window.self!==window.top}catch(e){return true}}
async function doExport(){const json=JSON.stringify({app:'multikoshelek',exported:new Date().toISOString(),data:S},null,1);const name=`koshelek-${today()}.json`;
  try{const file=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  if(!inFrame()){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Файл сохранён');return}catch(e){}}
  const s=sheet(`<h3>Резервная копия</h3><p class="muted" style="margin:0 0 10px;font-size:13px">Скопируй текст и сохрани в заметку или файл.</p><textarea class="inp" id="exT" readonly>${esc(json)}</textarea><div class="actions"><button class="btn pri" id="exCopy">Скопировать</button></div>`);
  s.querySelector('#exCopy').onclick=()=>{const t=s.querySelector('#exT');navigator.clipboard.writeText(t.value).then(()=>toast('Скопировано'),()=>{t.select();toast('Выдели и скопируй')})}}
function doImport(){const s=sheet(`<h3>Восстановить из копии</h3><input type="file" id="imF" accept=".json,application/json,text/plain" class="inp" style="margin-bottom:10px"><p class="muted" style="margin:0 0 6px;font-size:13px">или вставь текст копии:</p><textarea class="inp" id="imT"></textarea><div class="actions"><button class="btn" data-act="close">Отмена</button><button class="btn pri" id="imGo">Восстановить</button></div>`);
  const apply=txt=>{let o;try{o=JSON.parse(txt)}catch(e){toast('Файл не читается — это точно копия отсюда?');return}const d=o&&o.data||o;if(!d||!Array.isArray(d.accounts)||!Array.isArray(d.tx)){toast('В файле нет счетов и операций');return}
    ask('Заменить данные?','Текущие данные на этом устройстве заменятся данными из копии ('+d.tx.length+' операций).','Заменить',true,()=>{S=d;S.demo=false;save();render();toast('Восстановлено')})};
  s.querySelector('#imF').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>apply(r.result);r.readAsText(f)};
  s.querySelector('#imGo').onclick=()=>{const v=s.querySelector('#imT').value.trim();if(v)apply(v);else toast('Выбери файл или вставь текст')}}

document.addEventListener('click',e=>{if(drag.justDropped){drag.justDropped=false;return}
  const el=e.target.closest('[data-act]');if(!el){const c=e.target.closest('[data-tap]');if(c&&!drag.on)onTap(c.dataset.tap);return}
  const v=el.dataset.v;const A=el.dataset.act;
  switch(A){
  case'tab':U.tab=v;try{history.replaceState(null,'','#'+v)}catch(e){}closeSheet();render();window.scrollTo(0,0);break;
  case'base':S.base=v;save();render();break;
  case'month':{const m=addMonths(U.month+'-01',+v).slice(0,7);if(m<=mKey(today()))U.month=m;render();break}
  case'new':openTx({type:'expense'});break;
  case'close':closeSheet();break;
  case'fType':{const keep={from:F.from,to:F.to,a:F.a,d:F.d,note:F.note,who:F.who,edit:F.edit};const t=v;F.type=t;
    if(FROM_TYPES.includes(t)&&!F.from)F.from=F.to||(S.accounts[0]||{}).id;if(TO_TYPES.includes(t)&&!F.to)F.to=F.from;
    if(t==='transfer'&&F.from===F.to)F.to=(S.accounts.find(a=>!a.hidden&&a.id!==F.from)||{}).id||'';
    if(t==='expense'){const c=cat(F.cat);if(!c||c.kind!=='exp')F.cat=(S.cats.find(c=>c.kind==='exp')||{}).id}
    if(t==='income'){const c=cat(F.cat);if(!c||c.kind!=='inc')F.cat=(S.cats.find(c=>c.kind==='inc')||{}).id}
    drawTx();break}
  case'saveTx':saveTx();break;
  case'delTx':ask('Удалить операцию?','Остатки счетов пересчитаются.','Удалить',true,()=>{S.tx=S.tx.filter(t=>t.id!==F.edit);save();render();toast('Удалено')});break;
  case'editTx':{const t=S.tx.find(x=>x.id===v);if(!t)break;openTx({type:t.t,from:t.from||'',to:t.to||'',cat:t.cat||'',who:t.who||'',a:String(t.a),b:t.b!=null?String(t.b):'',d:t.d,note:t.note||'',edit:t.id});break}
  case'opsF':U.opsFilter=v;U.opsLimit=150;render();break;
  case'more':U.opsLimit+=150;render();break;
  case'stUnit':U.stUnit=v;U.stSel=null;render();break;

  case'stSel':U.stSel=v;render();break;
  case'addAcc':editAcc(null);break;
  case'addCat':editCat(null,v||'exp');break;
  case'accSheet':accSheet(v);break;
  case'catSheet':editCat(v);break;
  case'editAcc':editAcc(v);break;
  case'delAcc':ask('Удалить счёт?','Операций по нему нет, удаление безопасно.','Удалить',true,()=>{S.accounts=S.accounts.filter(a=>a.id!==v);save();render()});break;
  case'delCat':{const n=S.tx.filter(t=>t.cat===v).length;ask('Удалить категорию?',n?`${n} операций останутся, но будут «Без категории».`:'Операций в ней нет.','Удалить',true,()=>{S.cats=S.cats.filter(c=>c.id!==v);delete S.plans[v];save();render()});break}
  case'txFrom':openTx({type:'expense',from:v});break;

  case'txTr':openTx({type:'transfer',from:v});break;

  case'adjust':{const a=acc(v);const want=parseAmt($('#adjV').value);if(!Number.isFinite(want)){toast('Введи число');break}const delta=Math.round((want-balances()[v])*1e8)/1e8;if(!delta){toast('Остаток и так такой');break}
    S.tx.push(delta>0?{id:uid(),t:'adjust',d:today(),to:v,a:delta,note:''}:{id:uid(),t:'adjust',d:today(),from:v,a:-delta,note:''});save();closeSheet();render();toast(`Остаток: ${fmt(want,a.cur)}`);break}
  case'editPlan':editPlan(v);break;

  case'newBorrow':openTx({type:'borrow'});break;
  case'debtBack':{const d=debts()[v]||{};const [c,amt]=Object.entries(d).find(([,x])=>x>0)||[];const to=(S.accounts.find(a=>a.cur===c&&!a.hidden)||{}).id;openTx({type:'lendBack',who:v,to:to||'',a:amt?String(Math.round(amt*100)/100):''});break}
  case'debtPay':{const d=debts()[v]||{};const [c,amt]=Object.entries(d).find(([,x])=>x<0)||[];const from=(S.accounts.find(a=>a.cur===c&&!a.hidden)||{}).id;openTx({type:'borrowBack',who:v,from:from||'',a:amt?String(Math.round(-amt*100)/100):''});break}
  case'rateMode':S.rateMode=v;OWN=null;save();render();break;
  case'refreshRates':refreshRates(true);break;
  case'editRate':editRate(v);break;
  case'export':doExport();break;
  case'import':doImport();break;
  case'cleanStart':ask('Начать с чистого листа?','Удалятся примерные операции, долги, планы и график. Счета и категории останутся с нулевым остатком — переименуй их под себя.','Начать',false,()=>{S.tx=[];S.sched=[];S.plans={};S.accounts.forEach(a=>a.init=0);S.demo=false;save();render();toast('Готово. Начни с остатков на счетах')});break;
  case'wipe':ask('Удалить все данные?','Счета, операции, планы и долги удалятся с этого устройства. Сначала сохрани резервную копию.','Удалить всё',true,()=>{try{localStorage.removeItem(KEY)}catch(e){}S=seed();S.tx=[];S.sched=[];S.plans={};S.accounts.forEach(a=>a.init=0);S.demo=false;save();render()});break;
  }});
document.addEventListener('change',e=>{if(e.target.id==='opsAcc'){U.opsAcc=e.target.value;U.opsLimit=150;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&F&&$('#sheet')&&e.target.matches('#fA,#fB,#fN')){e.preventDefault();saveTx()}});
function onTap(k){const [kind,id]=k.split(':');
  if(kind==='acc')accSheet(id);else if(kind==='debt')debtSheet();
  else if(kind==='cat'){const c=cat(id);if(c.kind==='inc')openTx({type:'income',cat:id});else openTx({type:'expense',cat:id})}}

// ---------- drag & drop
const drag={on:false,pending:null,src:null,ghost:null,over:null,justDropped:false,timer:0,sx:0,sy:0};
function validDst(src,dst){const [sk,sid]=src.split(':');const [dk,did]=dst.split(':');
  if(sk==='inc')return dk==='acc';
  if(sk==='acc')return (dk==='acc'&&did!==sid)||dk==='exp'||dk==='debt';
  if(sk==='debt')return dk==='acc';return false}
function startDrag(cellEl,x,y){drag.on=true;drag.src=cellEl.dataset.src;const c=cellEl.querySelector('.circ');const g=c.cloneNode(true);g.classList.add('ghost');g.style.left=x+'px';g.style.top=y+'px';document.body.appendChild(g);drag.ghost=g;drag.cell=cellEl;cellEl.classList.add('dragging');
  document.querySelectorAll('[data-dst]').forEach(d=>{if(validDst(drag.src,d.dataset.dst))d.classList.add('dropok')});try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function moveDrag(x,y){drag.ghost.style.left=x+'px';drag.ghost.style.top=y+'px';const el=document.elementFromPoint(x,y);const d=el&&el.closest('[data-dst]');const ok=d&&validDst(drag.src,d.dataset.dst)?d:null;
  if(drag.over!==ok){drag.over&&drag.over.classList.remove('dropover');ok&&ok.classList.add('dropover');drag.over=ok}
  const m=60;if(y<m)window.scrollBy(0,-8);else if(y>innerHeight-m-60)window.scrollBy(0,8)}
function endDrag(){if(!drag.on)return;const src=drag.src,dst=drag.over&&drag.over.dataset.dst;drag.ghost.remove();drag.cell.classList.remove('dragging');
  document.querySelectorAll('.dropok,.dropover').forEach(d=>d.classList.remove('dropok','dropover'));drag.on=false;drag.over=null;drag.justDropped=true;setTimeout(()=>drag.justDropped=false,350);
  if(dst)dropAction(src,dst)}
function dropAction(src,dst){const [sk,sid]=src.split(':');const [dk,did]=dst.split(':');
  if(sk==='inc')openTx({type:'income',cat:sid,to:did});
  else if(sk==='acc'&&dk==='exp')openTx({type:'expense',from:sid,cat:did});
  else if(sk==='acc'&&dk==='acc')openTx({type:'transfer',from:sid,to:did});
  else if(sk==='acc'&&dk==='debt')openTx({type:'lend',from:sid});
  else if(sk==='debt'&&dk==='acc')openTx({type:'lendBack',to:did})}
function cancelPending(){clearTimeout(drag.timer);drag.pending=null}
// touch
document.addEventListener('touchstart',e=>{const c=e.target.closest('[data-src]');if(!c||e.touches.length>1)return;const t=e.touches[0];drag.sx=t.clientX;drag.sy=t.clientY;drag.pending=c;
  drag.timer=setTimeout(()=>{if(drag.pending)startDrag(drag.pending,drag.sx,drag.sy)},230)},{passive:true});
document.addEventListener('touchmove',e=>{const t=e.touches[0];if(drag.on){e.preventDefault();moveDrag(t.clientX,t.clientY);return}
  if(drag.pending&&(Math.abs(t.clientX-drag.sx)>9||Math.abs(t.clientY-drag.sy)>9))cancelPending()},{passive:false});
document.addEventListener('touchend',e=>{if(drag.on){e.preventDefault();endDrag()}else cancelPending()},{passive:false});
document.addEventListener('touchcancel',()=>{if(drag.on)endDrag();cancelPending()});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-src]'))e.preventDefault()});
// mouse
let mdown=null;
document.addEventListener('mousedown',e=>{if(e.button!==0)return;const c=e.target.closest('[data-src]');if(!c)return;mdown={c,x:e.clientX,y:e.clientY};e.preventDefault()});
document.addEventListener('mousemove',e=>{if(!mdown)return;if(!drag.on&&(Math.abs(e.clientX-mdown.x)>6||Math.abs(e.clientY-mdown.y)>6))startDrag(mdown.c,e.clientX,e.clientY);if(drag.on)moveDrag(e.clientX,e.clientY)});
document.addEventListener('mouseup',()=>{if(drag.on)endDrag();mdown=null});

// ---------- boot
render();
if(!S.rates.at||Date.now()-S.rates.at>6*3600e3)refreshRates(false);
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!inFrame())navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&U.tab==='home')render()});
window.__S=()=>S;
})();
</script>
